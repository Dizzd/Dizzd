<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#0b1c2d"/>
    </linearGradient>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orangeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="none" stroke="#17364f" stroke-width="4"/>

  <!-- subtle pixel accents -->
  <g shape-rendering="crispEdges" opacity=".75">
    <rect x="42" y="42" width="8" height="8" fill="#20d7e5"/>
    <rect x="58" y="42" width="8" height="8" fill="#f0a14a"/>
    <rect x="74" y="42" width="8" height="8" fill="#8a7cf5"/>
    <rect x="1118" y="42" width="8" height="8" fill="#8a7cf5"/>
    <rect x="1134" y="42" width="8" height="8" fill="#f0a14a"/>
    <rect x="1150" y="42" width="8" height="8" fill="#20d7e5"/>
  </g>

  <!-- title -->
  <rect x="410" y="28" width="380" height="76" rx="10" fill="#0b2235" stroke="#254d6d" stroke-width="3"/>
  <rect x="420" y="38" width="360" height="56" rx="8" fill="#081827" stroke="#17364f" stroke-width="2"/>
  <text x="528" y="76" text-anchor="middle" fill="#55dfff" font-family="monospace" font-size="36" font-weight="700" filter="url(#cyanGlow)">SKILL</text>
  <text x="674" y="76" text-anchor="middle" fill="#ffb45c" font-family="monospace" font-size="36" font-weight="700" filter="url(#orangeGlow)">TREE</text>

  <!-- connectors -->
  <g shape-rendering="crispEdges">
    <rect x="596" y="104" width="8" height="48" fill="#ffb45c"/>
    <rect x="220" y="148" width="760" height="6" fill="#193b54"/>
    <rect x="220" y="148" width="376" height="6" fill="#20d7e5" opacity=".7"/>
    <rect x="604" y="148" width="376" height="6" fill="#8a7cf5" opacity=".7"/>
    <rect x="216" y="144" width="14" height="14" fill="#20d7e5"/>
    <rect x="593" y="141" width="14" height="20" fill="#ffb45c"/>
    <rect x="976" y="144" width="14" height="14" fill="#8a7cf5"/>
  </g>

  <!-- security node -->
  <g>
    <rect x="70" y="182" width="300" height="174" rx="16" fill="#0d2436" stroke="#20d7e5" stroke-width="4"/>
    <rect x="86" y="198" width="268" height="48" rx="10" fill="#081827" stroke="#15415a" stroke-width="2"/>
    <text x="220" y="230" text-anchor="middle" fill="#62e7ff" font-family="monospace" font-size="27" font-weight="700">SECURITY</text>

    <g transform="translate(192 262)" fill="none" stroke="#62e7ff" stroke-width="4">
      <path d="M28 0 L52 10 V30 C52 48 40 59 28 64 C16 59 4 48 4 30 V10 Z"/>
      <rect x="19" y="25" width="18" height="15" rx="2"/>
      <path d="M22 25v-5c0-5 3-8 6-8s6 3 6 8v5"/>
    </g>

    <rect x="108" y="320" width="224" height="26" rx="6" fill="#09131d"/>
    <text x="220" y="339" text-anchor="middle" fill="#cfefff" font-family="monospace" font-size="17">SOC · SIEM · CEH</text>
  </g>

  <!-- devops node -->
  <g>
    <rect x="450" y="182" width="300" height="174" rx="16" fill="#25190f" stroke="#ffb45c" stroke-width="4"/>
    <rect x="466" y="198" width="268" height="48" rx="10" fill="#160f09" stroke="#62401f" stroke-width="2"/>
    <text x="600" y="230" text-anchor="middle" fill="#ffc070" font-family="monospace" font-size="27" font-weight="700">DEVOPS</text>

    <text x="600" y="306" text-anchor="middle" fill="#ffb45c" font-family="monospace" font-size="72" font-weight="700" filter="url(#orangeGlow)">∞</text>

    <rect x="488" y="320" width="224" height="26" rx="6" fill="#120d08"/>
    <text x="600" y="339" text-anchor="middle" fill="#f7e4cf" font-family="monospace" font-size="17">Docker · CI/CD · Linux</text>
  </g>

  <!-- ai node -->
  <g>
    <rect x="830" y="182" width="300" height="174" rx="16" fill="#1b1431" stroke="#8a7cf5" stroke-width="4"/>
    <rect x="846" y="198" width="268" height="48" rx="10" fill="#100c20" stroke="#3b2d66" stroke-width="2"/>
    <text x="980" y="230" text-anchor="middle" fill="#b7a8ff" font-family="monospace" font-size="27" font-weight="700">AI</text>

    <g transform="translate(944 262)" fill="none" stroke="#b7a8ff" stroke-width="4">
      <rect x="8" y="4" width="56" height="56" rx="12"/>
      <circle cx="24" cy="24" r="5"/><circle cx="48" cy="24" r="5"/>
      <path d="M24 40h24"/>
      <path d="M0 18h8M0 34h8M64 18h8M64 34h8M18 0v4M36 0v4M54 0v4M18 60v4M36 60v4M54 60v4"/>
    </g>

    <rect x="868" y="320" width="224" height="26" rx="6" fill="#0f0b19"/>
    <text x="980" y="339" text-anchor="middle" fill="#efeaff" font-family="monospace" font-size="15">ChatGPT · Copilot · Automation</text>
  </g>

  <!-- bottom accent -->
  <g shape-rendering="crispEdges">
    <rect x="426" y="384" width="348" height="4" fill="#17364f"/>
    <rect x="536" y="384" width="128" height="4" fill="#20d7e5"/>
    <rect x="592" y="376" width="16" height="16" fill="#f0a14a"/>
  </g>
</svg>